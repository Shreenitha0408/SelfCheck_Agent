[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfcheck-agent"
version = "0.1.0"
description = "Self-verifying document-QA agent with confidence-aware decision flagging"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "tqdm>=4.60",
  "numpy>=1.26",
  "httpx>=0.27",
  "rank-bm25>=0.2.2",
  "fastembed>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
