[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selfcheck-agent"
version = "0.1.0"
description = "Self-verifying document-QA agent with confidence-aware decision flagging"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "tqdm>=4.60",
  "numpy>=1.26",
  "httpx>=0.27",
  "rank-bm25>=0.2.2",
  "fastembed>=0.4",
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
  "huggingface_hub>=0.23",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]
app = ["gradio>=5", "fastapi>=0.110", "uvicorn>=0.29", "pypdf>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
